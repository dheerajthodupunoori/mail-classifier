[tool.poetry]
name = "mail-classifier"
version = "0.1.0"
description = "A Python-based email classification system"
authors = ["Dheeraj Thodupunuri <dheeraj.thodupunoori01@gmail.com>"]
readme = "README.md"
license = "MIT"

packages = [
    { include = "mail_classifier", from = "src" }
]

[tool.poetry.dependencies]
# allow any 3.9–3.13 interpreter (3.14 excluded to avoid Poetry bug)
python = ">=3.9,<3.14"
langgraph = "*"
langchain = "*"
google-api-python-client = "^2.190.0"
google-auth-httplib2 = "^0.3.0"
google-auth-oauthlib = "^1.3.0"
pydantic = "^2.12.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
